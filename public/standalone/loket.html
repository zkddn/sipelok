<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Layar Loket · SIPELOK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%230c2431'/%3E%3Cg fill='none' stroke='%23f2691f' stroke-width='7' stroke-linecap='round'%3E%3Crect x='30' y='34' width='68' height='56' rx='12'/%3E%3Cpath d='M30 52h68M46 76V64M60 76V58M74 76v-8'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/gaya.css" />
</head>
<body class="bg-board" style="color:var(--mist-50);min-height:100vh">
<script>
  window.onerror = function (msg, src, line) {
    var t = document.getElementById("app");
    if (t) t.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:26px;background:#0c2431;color:#f7f4ec;border-radius:16px;font-family:sans-serif"><b>Galat JavaScript</b><p style="margin:8px 0">' + msg + ' (baris ' + line + ')</p><p style="opacity:.7;margin:0">Muat ulang halaman (Ctrl+R), atau salin ulang folder <b>standalone</b> secara lengkap.</p></div>';
  };
</script>
<div id="app"></div>

<script src="js/util.js"></script>
<script>
  let override = null; // null = ikuti jam otomatis
  let lastAutoShift = null;

  function render() {
    const now = new Date();
    const autoShift = shiftForTime(now);
    lastAutoShift = autoShift;
    const shift = override || autoShift;
    const session = getSessionFor(shift);
    const url = scanUrlFor(session.token);
    const t = todayStr();

    const feed = S.records
      .filter((r) => r.date === t)
      .sort((a, b) => (b.masuk || "").localeCompare(a.masuk || ""));

    const petugasShift = jadwalUntuk(now).filter((j) => j.shift === shift);

    el("#app").innerHTML =
      '<header class="topbar"><div class="wrap">' +
        '<a class="brandmark" href="index.html"><span class="mk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M7 16.5v-3M11 16.5v-5M15 16.5v-2"/></svg></span>' +
        '<span><b>SIPELOK</b><small>Layar Loket</small></span></a>' +
        '<div class="grow"></div>' +
        '<span class="hide-sm" id="modeBadge"></span>' +
        '<span class="row hide-sm" style="gap:6px">' +
          [1, 2].map((s) => '<button class="btn sm ' + (shift === s ? "primary" : "ghost") + '" data-shift="' + s + '">' + SHIFT[s].label + ' · ' + SHIFT[s].nama + '</button>').join("") +
        '</span>' +
      '</div></header>' +

      '<main class="wrap" style="padding-top:30px;padding-bottom:56px">' +
        '<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:14px">' +
          '<div>' +
            '<span class="eyebrow on-dark">Loket Pelayanan Terpadu</span>' +
            '<h1 class="display" style="font-size:clamp(1.6rem,3.4vw,2.4rem);margin-top:8px">Presensi Petugas Piket</h1>' +
          '</div>' +
          '<div style="text-align:right">' +
            '<div class="clock tnum" id="jamBesar">' + pad(now.getHours()) + '.' + pad(now.getMinutes()) + '<span class="sec">.' + pad(now.getSeconds()) + '</span></div>' +
            '<span class="chipshift s' + shift + '" style="margin-top:8px">' + SHIFT[shift].label + ' · ' + SHIFT[shift].nama + ' ' + SHIFT[shift].waktu + ' WITA' + (override ? " (manual)" : "") + '</span>' +
          '</div>' +
        '</div>' +

        '<div class="grid-loket mt-3">' +
          '<section class="rise">' +
            '<div class="qr-frame">' +
              '<div class="scanline"></div>' +
              '<img src="' + qrImg(url, 560) + '" alt="QR presensi petugas" onerror="this.style.display=\'none\';document.getElementById(\'qrerr\').classList.remove(\'hidden\')" />' +
              '<p id="qrerr" class="hidden small" style="color:var(--ruby-700);text-align:center;padding:20px 0">QR tidak dapat dimuat (butuh internet). Gunakan tautan di bawah.</p>' +
              '<div class="mt-2" style="text-align:center">' +
                '<p style="font-weight:800;color:var(--ink-900);margin:0">Arahkan kamera HP ke QR ini</p>' +
                '<p class="small tnum muted" style="word-break:break-all;margin:6px 0 12px">' + esc(url) + '</p>' +
                '<div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">' +
                  '<button class="btn light sm" id="salin">⧉ Salin Tautan</button>' +
                  '<button class="btn primary sm" id="perbarui">↻ Perbarui QR</button>' +
                '</div>' +
                '<p class="small muted" style="margin-top:10px">Kode sesi: <b class="tnum">' + session.token + '</b> · berlaku hari ini</p>' +
              '</div>' +
            '</div>' +

            '<div class="card dark pad mt-2" style="background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);animation-delay:.1s">' +
              '<span class="eyebrow on-dark">Petugas Piket ' + SHIFT[shift].label + ' Hari Ini</span>' +
              '<div class="mt-1" style="display:flex;flex-direction:column;gap:8px">' +
                (petugasShift.length === 0 ? '<span class="small" style="color:var(--mist-300)">Belum dijadwalkan — atur di menu Admin → Jadwal Piket.</span>' :
                  petugasShift.map((j) => {
                    const p = S.petugas.find((x) => x.id === j.petugasId);
                    const rec = feed.find((r) => r.petugasId === j.petugasId && r.shift === shift);
                    let st = '<span class="badge amber">Belum scan</span>';
                    if (rec && rec.keluar) st = '<span class="badge mist">Selesai ' + fmtHM(rec.keluar) + '</span>';
                    else if (rec) st = '<span class="badge lagoon">Bertugas ' + fmtHM(rec.masuk) + '</span>';
                    return '<div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><b>' + esc(p ? p.nama : "—") + '</b>' + st + '</div>';
                  }).join("")) +
              '</div>' +
            '</div>' +
          '</section>' +

          '<aside class="rise" style="animation-delay:.12s">' +
            '<div class="row" style="justify-content:space-between">' +
              '<span class="eyebrow on-dark"><span class="dot live-dot"></span> Umpan Presensi Hari Ini</span>' +
              '<span class="badge ghost tnum">' + feed.length + ' catatan</span>' +
            '</div>' +
            '<div class="mt-1" style="display:flex;flex-direction:column;gap:9px">' +
              (feed.length === 0 ? '<div class="card dark pad center small" style="background:rgba(255,255,255,.05);color:var(--mist-300)">Belum ada presensi hari ini.<br>Setiap scan petugas akan muncul di sini seketika.</div>' :
                feed.map((r) => {
                  const st = r.keluar
                    ? '<span class="badge mist">' + fmtHM(r.masuk) + '–' + fmtHM(r.keluar) + '</span>'
                    : '<span class="badge lagoon"><span class="dot live-dot"></span> masuk ' + fmtHM(r.masuk) + '</span>';
                  const foto = (r.fotoMasuk || r.fotoKeluar) ? '<img class="foto" src="' + (r.fotoMasuk || r.fotoKeluar) + '" alt="">' : '<span class="ini">' + inisial(r.nama) + '</span>';
                  return '<div class="feed-item">' + foto +
                    '<div class="grow" style="min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.nama) + '</b>' +
                    '<span class="small tnum" style="color:var(--mist-300)">' + SHIFT[r.shift].label + ' · ' + fmtDurasi(durasiMenit(r)) + '</span></div>' + st + '</div>';
                }).join("")) +
            '</div>' +
          '</aside>' +
        '</div>' +
      '</main>';

    el("#modeBadge").innerHTML = modeBadgeHtml();
    el("#salin").onclick = async () => {
      const ok = await copyText(url);
      el("#salin").textContent = ok ? "✓ Tersalin" : "Gagal menyalin";
      setTimeout(() => { const b = el("#salin"); if (b) b.textContent = "⧉ Salin Tautan"; }, 1600);
    };
    el("#perbarui").onclick = () => { renewSession(shift); render(); };
    document.querySelectorAll("[data-shift]").forEach((b) =>
      b.onclick = () => { override = Number(b.dataset.shift) === autoShift ? null : Number(b.dataset.shift); render(); });
  }

  /* jam diperbarui ringan tiap detik tanpa merender ulang seluruh halaman
     (mencegah QR berkedip); render penuh hanya saat data/shift berubah */
  setInterval(() => {
    const now = new Date();
    const j = el("#jamBesar");
    if (j) j.innerHTML = pad(now.getHours()) + "." + pad(now.getMinutes()) + '<span class="sec">.' + pad(now.getSeconds()) + "</span>";
    if (!override && shiftForTime(now) !== lastAutoShift) render();
  }, 1000);

  (async () => {
    try {
      await init();
      render();
      startSync();
      onChange(render);
    } catch (err) {
      console.error(err);
      el("#app").innerHTML = '<div style="max-width:520px;margin:14vh auto;padding:26px;background:#0c2431;color:#f7f4ec;border-radius:16px;font-family:sans-serif"><b>Gagal memuat aplikasi</b><p>' + String(err && err.message || err) + '</p></div>';
    }
  })();
</script>
</body>
</html>

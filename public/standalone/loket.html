<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Layar Loket · SIPELOK</title>
<link rel="icon" href="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%230c2431'/%3E%3Cg fill='none' stroke='%23f2691f' stroke-width='7' stroke-linecap='round'%3E%3Crect x='30' y='34' width='68' height='56' rx='12'/%3E%3Cpath d='M30 52h68M46 76V64M60 76V58M74 76v-8'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/gaya.css" />
</head>
<body class="bg-board" style="color:var(--mist-50);min-height:100vh">
<script>
  window.onerror = function (msg, src, line) {
    var t = document.getElementById("app");
    if (t) t.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:26px;background:#0c2431;color:#f7f4ec;border-radius:16px;font-family:sans-serif"><b>Galat JavaScript</b><p style="margin:8px 0">' + msg + ' (baris ' + line + ')</p><p style="opacity:.7;margin:0">Muat ulang halaman (Ctrl+R).</p></div>';
  };
</script>
<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--mist-300)"><span class="spin" style="font-size:1.6rem">◌</span>&nbsp; Memuat…</div></div>

<script src="js/util.js"></script>
<script>
  function render() {
    const now = new Date();
    const t = todayStr();
    const shiftAktif = shiftForTime(now);
    const jd = jadwalUntukTanggal(t);

    // Generate QR code URL untuk presensi.html
    const presensiUrl = location.origin + location.pathname.replace('loket.html', 'presensi.html');
    const qrCodeUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(presensiUrl);

    // kelompokkan per shift
    const shift1 = jd.filter((j) => j.shift === 1).sort((a, b) => a.urutan - b.urutan);
    const shift2 = jd.filter((j) => j.shift === 2).sort((a, b) => a.urutan - b.urutan);

    function renderKolom(shift, list) {
      const def = SHIFT[shift];
      const waktu = waktuShift(t, shift);
      const aktif = shift === shiftAktif;
      const sudah = list.filter((j) => {
        const rec = S.records.find((r) => r.date === t && r.shift === shift && r.petugasId === j.petugasId);
        return rec && rec.keluar;
      }).length;
      const sedang = list.filter((j) => {
        const rec = S.records.find((r) => r.date === t && r.shift === shift && r.petugasId === j.petugasId);
        return rec && !rec.keluar;
      }).length;

      const baris = list.map((j) => {
        const p = S.petugas.find((x) => x.id === j.petugasId);
        const rec = S.records.find((r) => r.date === t && r.shift === shift && r.petugasId === j.petugasId);
        let st = '<span class="badge ruby">Belum absen</span>';
        if (rec && rec.keluar) st = '<span class="badge mist">Selesai ' + fmtHM(rec.masuk) + '–' + fmtHM(rec.keluar) + '</span>';
        else if (rec) st = '<span class="badge lagoon"><span class="dot live-dot"></span> Bertugas ' + fmtHM(rec.masuk) + '</span>';
        const role = ROLE_MAP[j.urutan] || "—";
        return '<div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)">' +
          '<div class="row" style="gap:10px"><span class="ini" style="width:36px;height:36px;font-size:.9rem">' + inisial(p ? p.nama : "?") + '</span><div><b>' + esc(p ? p.nama : "—") + '</b><br><span class="small" style="color:var(--mist-400)">' + role + '</span></div></div>' + st + '</div>';
      }).join("");

      return '<div class="card dark pad" style="background:' + (aktif ? "rgba(242,105,31,.08)" : "rgba(255,255,255,.05)") + ';border-color:' + (aktif ? "var(--brand-500)" : "rgba(255,255,255,.12)") + '">' +
        '<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">' +
          '<div><span class="badge ' + (shift === 1 ? "brand" : "lagoon") + '">' + def.label + ' · ' + def.nama + '</span>' +
          (aktif ? '<span class="small" style="color:var(--brand-400);font-weight:800;margin-left:8px">● sedang berjalan</span>' : '') + '</div>' +
          '<span class="small tnum" style="color:var(--mist-300)">' + waktu + ' WITA</span>' +
        '</div>' +
        '<div class="row mt-1" style="gap:14px;flex-wrap:wrap">' +
          '<span class="small" style="color:var(--mist-300)"><b style="color:var(--lagoon-100)">' + sedang + '</b> sedang bertugas</span>' +
          '<span class="small" style="color:var(--mist-300)"><b style="color:var(--mist-100)">' + sudah + '</b> selesai</span>' +
          '<span class="small" style="color:var(--mist-300)"><b style="color:var(--ruby-100)">' + (list.length - sudah - sedang) + '</b> belum absen</span>' +
        '</div>' +
        '<div class="mt-1">' + (list.length === 0 ? '<span class="small" style="color:var(--mist-400)">Belum ada petugas dijadwalkan.</span>' : baris) + '</div>' +
      '</div>';
    }

    el("#app").innerHTML =
      '<header class="topbar"><div class="wrap">' +
        '<a class="brandmark" href="index.html"><span class="mk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M7 16.5v-3M11 16.5v-5M15 16.5v-2"/></svg></span>' +
        '<span><b>SIPELOK</b><small>Layar Loket</small></span></a>' +
        '<div class="grow"></div><span id="modeBadge" class="hide-sm"></span>' +
      '</div></header>' +

      '<main class="wrap" style="padding-top:30px;padding-bottom:56px">' +
        '<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:14px">' +
          '<div>' +
            '<span class="eyebrow on-dark">Loket Pelayanan Terpadu</span>' +
            '<h1 class="display" style="font-size:clamp(1.6rem,3.4vw,2.4rem);margin-top:8px">Petugas Piket Hari Ini</h1>' +
            '<p class="small mt-1" style="color:var(--mist-300)">' + fmtDateLong(t) + '</p>' +
          '</div>' +
          '<div style="text-align:right">' +
            '<div class="clock tnum" id="jamBesar">' + pad(now.getHours()) + '.' + pad(now.getMinutes()) + '<span class="sec">.' + pad(now.getSeconds()) + '</span></div>' +
            '<span class="chipshift s' + shiftAktif + '" style="margin-top:8px">' + SHIFT[shiftAktif].label + ' · ' + SHIFT[shiftAktif].nama + ' ' + waktuShift(t, shiftAktif) + ' WITA</span>' +
          '</div>' +
        '</div>' +

        '<div class="card dark pad mt-3" style="text-align:center">' +
          '<span class="eyebrow on-dark">Akses Cepat Presensi</span>' +
          '<p class="small mt-1" style="color:var(--mist-300)">Scan QR code di bawah dengan HP untuk membuka halaman presensi</p>' +
          '<div style="margin:20px auto;display:inline-block;background:white;padding:20px;border-radius:16px">' +
            '<img src="' + qrCodeUrl + '" alt="QR Code Presensi" style="width:250px;height:250px;display:block" />' +
          '</div>' +
          '<p class="small" style="color:var(--mist-400);word-break:break-all">' + esc(presensiUrl) + '</p>' +
        '</div>' +

        '<div class="grid-2 mt-3">' +
          renderKolom(1, shift1) +
          renderKolom(2, shift2) +
        '</div>' +


      '</main>';

    el("#modeBadge").innerHTML = modeBadgeHtml();
  }

  setInterval(() => {
    const now = new Date();
    const j = el("#jamBesar");
    if (j) j.innerHTML = pad(now.getHours()) + "." + pad(now.getMinutes()) + '<span class="sec">.' + pad(now.getSeconds()) + "</span>";
  }, 1000);

  (async () => {
    try {
      await init();
      render();
      startSync();
      onChange(render);
    } catch (err) {
      console.error(err);
      el("#app").innerHTML = '<div style="max-width:520px;margin:14vh auto;padding:26px;background:#0c2431;color:#f7f4ec;border-radius:16px;font-family:sans-serif"><b>Gagal memuat aplikasi</b><p>' + String(err && err.message || err) + '</p></div>';
    }
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Layar Loket · SIPELOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/gaya.css" />
</head>
<body class="bg-board" style="min-height:100vh;display:flex;flex-direction:column">

  <header class="topbar" style="background:rgba(7,26,36,.6);backdrop-filter:blur(6px)">
    <div class="wrap">
      <a class="brandmark" href="index.html">
        <span class="mk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M7 16.5v-3M11 16.5v-5M15 16.5v-2"/></svg></span>
        <span><b>SIPELOK</b><small>Layar Loket</small></span>
      </a>
      <div class="grow"></div>
      <span id="modeBadge" class="hide-sm"></span>
      <span class="small hide-sm" style="color:var(--mist-300)">Shift:</span>
      <button class="btn ghost sm" id="btnShift1" onclick="setShift(1)">Shift 1 · Pagi</button>
      <button class="btn ghost sm" id="btnShift2" onclick="setShift(2)">Shift 2 · Siang</button>
    </div>
  </header>

  <main class="wrap grow" style="padding-top:34px;padding-bottom:44px">
    <div class="grid-loket">

      <!-- ===== kiri: QR ===== -->
      <section class="center rise">
        <span class="eyebrow" style="color:var(--brand-400)"><span class="dot live"></span> Scan untuk presensi</span>
        <h2 class="display" style="color:#fff;margin-top:10px" id="judulShift">—</h2>

        <div style="display:flex;justify-content:center;margin-top:22px">
          <div class="qr-frame">
            <div class="qr-scan"></div>
            <img id="qrImg" alt="QR presensi" width="244" height="244" />
          </div>
        </div>

        <div class="mt-2" style="max-width:340px;margin-left:auto;margin-right:auto">
          <p class="small" style="color:var(--mist-300);word-break:break-all" id="qrUrl">—</p>
          <div class="row mt-1" style="justify-content:center">
            <button class="btn ghost sm" onclick="salin()">📋 Salin Tautan</button>
            <button class="btn primary sm" onclick="perbarui()">↻ Perbarui QR</button>
          </div>
          <p class="small mt-1" style="color:var(--mist-400)">QR butuh internet untuk digambar. Tanpa internet, gunakan tautan di atas.</p>
        </div>

        <div class="card dark pad mt-3 rise" style="text-align:left;animation-delay:.15s">
          <span class="eyebrow" style="color:var(--brand-400)">Petugas Piket Hari Ini</span>
          <div id="piket" class="mt-1" style="display:flex;flex-direction:column;gap:8px"></div>
        </div>
      </section>

      <!-- ===== kanan: feed langsung ===== -->
      <section class="rise" style="animation-delay:.1s">
        <div class="row" style="justify-content:space-between">
          <span class="eyebrow" style="color:var(--mist-300)">Presensi Hari Ini</span>
          <span class="badge mist" id="hitung">0</span>
        </div>
        <div class="clock tnum mt-1" style="font-size:2.6rem" id="jam">--.--</div>
        <p class="small" style="color:var(--mist-300)" id="tanggal"></p>

        <div class="feed mt-2" id="feed"></div>
      </section>
    </div>
  </main>

<script src="js/util.js"></script>
<script>
  let shiftAktif = null;   // null = ikuti jam

  function shiftNow() { return shiftAktif || shiftForTime(new Date()); }

  function setShift(s) {
    shiftAktif = (shiftAktif === s) ? null : s;
    renderQR();
  }

  function renderQR() {
    const s = getSessionFor(shiftNow());
    const url = scanUrlFor(s.token);
    el("#qrImg").src = qrImg(url, 244);
    el("#qrUrl").textContent = url;
    const def = SHIFT[shiftNow()];
    el("#judulShift").textContent = def.label + " · " + def.nama + " (" + def.waktu + ")";
    el("#btnShift1").classList.toggle("primary", shiftNow() === 1);
    el("#btnShift1").classList.toggle("ghost", shiftNow() !== 1);
    el("#btnShift2").classList.toggle("primary", shiftNow() === 2);
    el("#btnShift2").classList.toggle("ghost", shiftNow() !== 2);
  }

  function perbarui() { renewSession(shiftNow()); renderQR(); }
  async function salin() {
    const ok = await copyText(scanUrlFor(getSessionFor(shiftNow()).token));
    alert(ok ? "Tautan disalin." : "Gagal menyalin.");
  }

  function renderFeed() {
    const t = todayStr();
    const list = S.records.filter((r) => r.date === t).sort((a, b) => new Date(b.masuk) - new Date(a.masuk));
    el("#hitung").textContent = list.length + " presensi";
    const box = el("#feed");
    if (!list.length) { box.innerHTML = '<p class="small" style="color:var(--mist-400)">Belum ada presensi hari ini. Petugas dapat memindai QR di samping.</p>'; return; }
    box.innerHTML = list.map((r) => {
      const foto = r.fotoMasuk ? '<img class="ph" src="' + r.fotoMasuk + '" alt="">' : '<span class="ini">' + inisial(r.nama) + '</span>';
      const status = r.keluar
        ? '<span class="badge mist">Selesai ' + fmtHM(r.keluar) + '</span>'
        : '<span class="badge lagoon">Bertugas</span>';
      return '<div class="feed-item">' + foto +
        '<div class="grow"><div class="nm">' + esc(r.nama) + '</div><div class="tm tnum">Masuk ' + fmtHM(r.masuk) + ' · ' + SHIFT[r.shift].label + '</div></div>' +
        status + '</div>';
    }).join("");
  }

  function renderPiket() {
    const jd = jadwalUntuk(new Date());
    const box = el("#piket");
    if (!jd.length) { box.innerHTML = '<span class="small" style="color:var(--mist-400)">Belum dijadwalkan.</span>'; return; }
    box.innerHTML = [1, 2].map((sh) => {
      const list = jd.filter((j) => j.shift === sh).map((j) => { const p = S.petugas.find((x) => x.id === j.petugasId); return p ? p.nama : "—"; });
      if (!list.length) return "";
      return '<div class="row" style="gap:10px"><span class="badge ' + (sh === 1 ? "brand" : "lagoon") + '">' + SHIFT[sh].label + '</span><b style="color:#fff;font-size:.86rem">' + esc(list.join(" & ")) + '</b></div>';
    }).join("");
  }

  function tick() {
    const d = new Date();
    el("#jam").textContent = pad(d.getHours()) + "." + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    el("#tanggal").textContent = fmtDateLong(todayStr(d));
    if (!shiftAktif) renderQR();      // ikuti pergantian shift otomatis
  }

  (async () => {
    await init();
    el("#modeBadge").innerHTML = modeBadgeHtml();
    renderQR(); renderFeed(); renderPiket(); tick();
    setInterval(tick, 1000);
    onChange(() => { renderFeed(); renderPiket(); });
    startSync();
  })();
</script>
</body>
</html>

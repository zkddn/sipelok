<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin & Rekap · SIPELOK</title>
<link rel="icon" href="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%230c2431'/%3E%3Cg fill='none' stroke='%23f2691f' stroke-width='7' stroke-linecap='round'%3E%3Crect x='30' y='34' width='68' height='56' rx='12'/%3E%3Cpath d='M30 52h68M46 76V64M60 76V58M74 76v-8'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/gaya.css" />
<style>
  .filter-chip { padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--mist-200); font-weight: 800; font-size: .78rem; cursor: pointer; background: #fff; color: var(--ink-600); transition: all .15s; }
  .filter-chip.on { background: var(--ink-900); border-color: var(--ink-900); color: #fff; }
  .kalender { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .kalender .tgl { background: #fff; border: 1.5px solid var(--mist-200); border-radius: 12px; padding: 10px; font-size: .72rem; transition: border-color .15s; }
  .kalender .tgl:hover { border-color: var(--brand-500); }
  .kalender .tgl.libur { background: var(--mist-100); opacity: .5; }
  .kalender .tgl .nomor { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--ink-900); }
  .kalender .tgl .shift { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--mist-200); }
  .kalender .tgl .shift b { display: block; font-size: .62rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-500); margin-bottom: 3px; }
  .kalender .tgl .shift .petugas { font-size: .68rem; color: var(--ink-700); line-height: 1.4; }
  .kalender .tgl.kosong { background: var(--mist-100); opacity: .3; }
  .kalender .tgl.clickable { cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
  .kalender .tgl.clickable:hover { border-color: var(--brand-500); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(242, 105, 31, 0.2); }
</style>
</head>
<body class="bg-paper">
<script>
  window.onerror = function (msg, src, line) {
    var t = document.getElementById("app");
    if (t) t.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:26px;background:#0c2431;color:#f7f4ec;border-radius:16px;font-family:sans-serif"><b>Galat JavaScript</b><p style="margin:8px 0">' + msg + ' (baris ' + line + ')</p></div>';
  };
</script>
<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-500)"><span class="spin" style="font-size:1.6rem">◌</span>&nbsp; Memuat…</div></div>

<script src="js/util.js"></script>
<script>
  let akun = null, tabAktif = "rekap";
  let q = "", cepat = "today", fShift = 0, fDari = "", fSampai = "";
  let terpilih = [];
  let kalTahun = new Date().getFullYear(), kalBulan = new Date().getMonth() + 1;

  /* ============ gerbang masuk ============ */
  function renderLogin() {
    el("#app").innerHTML =
      '<div class="bg-board" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">' +
      '<div class="card pad rise" style="width:100%;max-width:400px">' +
        '<div class="row"><span class="mk" style="width:44px;height:44px;border-radius:12px;background:var(--brand-500);color:#1d1206;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3 5 5.8v5.4c0 4.5 3 7.8 7 9.3 4-1.5 7-4.8 7-9.3V5.8L12 3Z"/><path d="m9 11.5 2.2 2.2L15.5 9"/></svg></span>' +
        '<div><b class="display" style="font-size:1.2rem">Konsol Admin</b><br><span class="small muted">SIPELOK · BPS Kab. Konawe</span></div></div>' +
        '<div class="mt-2"><label class="f">Nama Pengguna</label><input class="input" id="lu" value="admin" autocomplete="username"></div>' +
        '<div class="mt-1"><label class="f">Kata Sandi</label><input class="input" id="lp" type="password" placeholder="••••••••" autocomplete="current-password"></div>' +
        '<p id="lerr" class="small" style="color:var(--ruby-700);margin-top:10px;min-height:1em"></p>' +
        '<button class="btn primary block mt-1" id="lbtn">Masuk</button>' +
        '<p class="small muted center mt-2">Akun bawaan: <b>admin</b> / <b>bpskonawe</b></p>' +
        '<p class="small muted center" style="margin-top:4px">Terkunci? Jalankan <b>DELETE FROM akun;</b> di phpMyAdmin, lalu muat ulang.</p>' +
        '<p class="small center mt-1"><a href="index.html">← Kembali ke beranda</a></p>' +
      '</div></div>';
    const go = () => {
      const a = login(el("#lu").value, el("#lp").value);
      if (!a) {
        el("#lerr").textContent = "Nama pengguna atau kata sandi salah.";
        const k = el("#app .card"); if (k) { k.classList.remove("shake"); void k.offsetWidth; k.classList.add("shake"); }
        return;
      }
      akun = a; renderShell();
    };
    el("#lbtn").onclick = go;
    el("#lp").onkeydown = (e) => { if (e.key === "Enter") go(); };
    el("#lp").focus();
  }

  /* ============ kerangka ============ */
  function renderShell() {
    const tabs = [
      ["rekap", "📊 Rekap Presensi"], ["jadwal", "🗓 Jadwal Piket"],
      ["petugas", "👤 Petugas"], ["akun", "🔐 Akun & Data"],
    ];
    el("#app").innerHTML =
      '<header class="topbar"><div class="wrap">' +
        '<a class="brandmark" href="index.html"><span class="mk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M7 16.5v-3M11 16.5v-5M15 16.5v-2"/></svg></span>' +
        '<span><b>SIPELOK</b><small>Konsol Admin</small></span></a>' +
        '<div class="grow"></div><span id="modeBadge" class="hide-sm"></span>' +
        '<span class="badge brand">' + esc(akun.nama) + (akun.role !== "admin" ? " · lihat" : "") + '</span>' +
        '<button class="btn ghost sm" id="keluar">Keluar</button>' +
      '</div></header>' +
      '<nav class="tabs" id="tabbar">' + tabs.map((t) =>
        '<button data-tab="' + t[0] + '" class="' + (t[0] === tabAktif ? "on" : "") + '">' + t[1] + '</button>').join("") + '</nav>' +
      '<main class="wrap" style="padding-top:26px;padding-bottom:60px"><div id="isi"></div></main>' +
      '<div id="lb" class="modal-bg hidden" onclick="tutupLb()"><img id="lbImg" alt="foto atribut"></div>';

    el("#modeBadge").innerHTML = modeBadgeHtml();
    el("#keluar").onclick = () => { logout(); akun = null; renderLogin(); };
    document.querySelectorAll("#tabbar button").forEach((b) =>
      b.onclick = () => { tabAktif = b.dataset.tab; renderShell(); });
    renderTab();
  }

  function renderTab() {
    if (!akun) return;
    if (tabAktif === "rekap") renderRekap();
    else if (tabAktif === "jadwal") renderJadwal();
    else if (tabAktif === "petugas") renderPetugas();
    else renderAkun();
  }

  /* ============ PIKET HARI INI ============ */
  function piketHariIniHtml() {
    const t = todayStr(), jd = jadwalUntukTanggal(t);
    const baris = [1, 2].map((sh) => {
      const list = jd.filter((j) => j.shift === sh).sort((a, b) => a.urutan - b.urutan);
      if (!list.length) return "";
      const isi = list.map((j) => {
        const p = S.petugas.find((x) => x.id === j.petugasId);
        const rec = S.records.find((r) => r.date === t && r.shift === sh && r.petugasId === j.petugasId);
        let st = '<span class="badge ruby">Belum presensi</span>';
        if (rec && rec.keluar) st = '<span class="badge mist">Selesai ' + fmtHM(rec.masuk) + '–' + fmtHM(rec.keluar) + '</span>';
        else if (rec) st = '<span class="badge lagoon">Bertugas sejak ' + fmtHM(rec.masuk) + '</span>';
        return '<div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><b>' + esc(p ? p.nama : "—") + '</b>' + st + '</div>';
      }).join("");
      return '<div class="card pad" style="padding:14px 18px"><span class="badge ' + (sh === 1 ? "brand" : "lagoon") + '">' + SHIFT[sh].label + ' · ' + SHIFT[sh].nama + ' (' + waktuShift(t, sh) + ')</span><div class="mt-1" style="display:flex;flex-direction:column;gap:8px">' + isi + '</div></div>';
    }).join("");
    return '<div class="card pad rise"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="eyebrow">Piket Hari Ini — ' + fmtDateLong(t) + '</span>' +
      '<button class="btn light sm no-print" id="keJadwal">Atur Jadwal →</button></div>' +
      '<div class="grid-2 mt-1">' + (baris || '<span class="small muted">Belum ada jadwal hari ini.</span>') + '</div></div>';
  }

  /* ============ REKAP ============ */
  function barisRekap() {
    let rows = S.records.slice();
    const t = todayStr();
    if (cepat === "today") rows = rows.filter((r) => r.date === t);
    else if (cepat === "7d") { const d = new Date(); d.setDate(d.getDate() - 6); const s = todayStr(d); rows = rows.filter((r) => r.date >= s); }
    else if (cepat === "month") { const m = t.slice(0, 7); rows = rows.filter((r) => r.date.indexOf(m) === 0); }
    else { if (fDari) rows = rows.filter((r) => r.date >= fDari); if (fSampai) rows = rows.filter((r) => r.date <= fSampai); }
    if (fShift) rows = rows.filter((r) => r.shift === fShift);
    if (q) rows = rows.filter((r) => r.nama.toLowerCase().indexOf(q.toLowerCase()) >= 0);
    return rows.sort((a, b) => (b.date + (b.masuk || "")).localeCompare(a.date + (a.masuk || "")));
  }

  function renderRekap() {
    const rows = barisRekap();
    const isAdmin = akun && akun.role === "admin";
    terpilih = terpilih.filter((id) => rows.some((r) => r.id === id));
    const stat = {
      total: rows.length,
      selesai: rows.filter((r) => r.keluar).length,
      bertugas: rows.filter((r) => !r.keluar).length,
      telat: rows.filter((r) => menitTerlambat(r) > 0).length,
    };
    const chips = [["today", "Hari Ini"], ["7d", "7 Hari"], ["month", "Bulan Ini"], ["all", "Semua"]];

    el("#isi").innerHTML =
      piketHariIniHtml() +
      '<div class="stats mt-2">' +
        statCard(stat.total, "Total Presensi", "pada rentang terpilih") +
        statCard(stat.selesai, "Selesai", "masuk & pulang tercatat") +
        statCard(stat.bertugas, "Sedang Bertugas", "belum presensi pulang") +
        statCard(stat.telat, "Terlambat", "> 10 mnt dari jadwal") +
      '</div>' +
      '<div class="card pad mt-2 rise no-print">' +
        '<div class="row" style="flex-wrap:wrap;gap:8px">' +
          chips.map((c) => '<button class="filter-chip ' + (cepat === c[0] ? "on" : "") + '" data-q="' + c[0] + '">' + c[1] + '</button>').join("") +
          '<input class="input inline grow" style="min-width:180px" id="cq" placeholder="Cari nama petugas…" value="' + esc(q) + '">' +
        '</div>' +
        '<div class="row mt-1" style="flex-wrap:wrap;gap:8px">' +
          '<input type="date" class="input inline" id="cdari" value="' + fDari + '">' +
          '<span class="muted">–</span><input type="date" class="input inline" id="csampai" value="' + fSampai + '">' +
          '<select class="input inline" id="cshift"><option value="0">Semua shift</option><option value="1" ' + (fShift === 1 ? "selected" : "") + '>Shift 1 · Pagi</option><option value="2" ' + (fShift === 2 ? "selected" : "") + '>Shift 2 · Siang</option></select>' +
          '<div class="grow"></div>' +
          '<button class="btn light sm" id="cetak">🖨 Cetak</button>' +
          '<button class="btn primary sm" id="csv">⬇ Ekspor CSV</button>' +
          (isAdmin ? '<button class="btn danger sm" id="hpilih" ' + (terpilih.length ? "" : "disabled") + '>🗑 Hapus Terpilih' + (terpilih.length ? " (" + terpilih.length + ")" : "") + '</button>' : "") +
        '</div>' +
        (isAdmin ? '<p class="small muted mt-1" style="margin-bottom:0">Tip: unduh CSV lebih dulu, lalu centang &amp; hapus catatan lama agar rekap tetap ringan.</p>' : "") +
      '</div>' +
      '<div class="table-wrap mt-2 rise">' +
        (rows.length === 0 ? '<div class="pad center small muted">Tidak ada data pada rentang ini.</div>' :
        '<table><thead><tr>' + (isAdmin ? '<th class="pil no-print"><input type="checkbox" id="psemua" ' + (rows.every((r) => terpilih.indexOf(r.id) >= 0) ? "checked" : "") + ' title="Pilih semua yang tampil"></th>' : "") +
        '<th>Petugas</th><th>Tanggal</th><th>Shift</th><th>Masuk</th><th>Pulang</th><th>Durasi</th><th>Foto</th><th>Status</th>' + (isAdmin ? '<th class="no-print">Aksi</th>' : "") + '</tr></thead><tbody>' +
        rows.map((r) => {
          const p = S.petugas.find((x) => x.id === r.petugasId);
          const telat = menitTerlambat(r);
          const status = r.keluar ? '<span class="badge mist">Selesai</span>' : '<span class="badge lagoon">Bertugas</span>';
          const foto = (r.fotoMasuk || r.fotoKeluar) ? '<button class="btn light sm" data-foto="' + (r.fotoMasuk || r.fotoKeluar) + '">Lihat</button>' : '<span class="muted small">—</span>';
          const pilih = terpilih.indexOf(r.id) >= 0;
          return '<tr class="' + (r.date === todayStr() ? "today" : "") + (pilih ? " sel" : "") + '">' +
            (isAdmin ? '<td class="pil no-print"><input type="checkbox" data-pilih="' + r.id + '" ' + (pilih ? "checked" : "") + '></td>' : "") +
            '<td><div class="row"><span class="ini">' + inisial(r.nama) + '</span><div><b>' + esc(r.nama) + '</b><br><span class="small muted tnum">' + esc(p && p.nip ? p.nip : "NIP —") + '</span></div></div></td>' +
            '<td class="tnum">' + fmtDateShort(r.date) + '</td>' +
            '<td><span class="badge ' + (r.shift === 1 ? "brand" : "lagoon") + '">' + SHIFT[r.shift].label + '</span></td>' +
            '<td class="tnum"><b style="color:var(--lagoon-700)">' + fmtHM(r.masuk) + '</b>' + (telat > 0 ? '<br><span class="small" style="color:var(--ruby-700)">+' + telat + ' mnt</span>' : '') + '</td>' +
            '<td class="tnum">' + (r.keluar ? fmtHM(r.keluar) : "—") + '</td>' +
            '<td class="tnum">' + fmtDurasi(durasiMenit(r)) + '</td>' +
            '<td>' + foto + '</td><td>' + status + '</td>' +
            (isAdmin ? '<td class="no-print"><button class="btn ghost sm" data-hapusrec="' + r.id + '" style="background:var(--ruby-100);color:var(--ruby-700);border-color:rgba(165,42,47,.25)">🗑</button></td>' : "") + '</tr>';
        }).join("") + '</tbody></table>') +
        '<div class="pad small muted" style="padding:12px 18px">Menampilkan ' + rows.length + ' dari ' + S.records.length + ' catatan.</div>' +
      '</div>';

    const kj = el("#keJadwal"); if (kj) kj.onclick = () => { tabAktif = "jadwal"; renderShell(); };
    document.querySelectorAll(".filter-chip").forEach((c) => c.onclick = () => { cepat = c.dataset.q; renderRekap(); });
    const cq = el("#cq");
    if (cq) { cq.oninput = (e) => { q = e.target.value; renderRekap(); }; cq.focus(); cq.setSelectionRange(cq.value.length, cq.value.length); }
    el("#cdari").onchange = (e) => { fDari = e.target.value; cepat = "all"; renderRekap(); };
    el("#csampai").onchange = (e) => { fSampai = e.target.value; cepat = "all"; renderRekap(); };
    el("#cshift").onchange = (e) => { fShift = Number(e.target.value); renderRekap(); };
    el("#csv").onclick = () => {
      const data = [["Nama", "NIP", "Tanggal", "Shift", "Masuk", "Pulang", "Durasi (mnt)", "Status"]].concat(
        rows.map((r) => { const p = S.petugas.find((x) => x.id === r.petugasId); return [r.nama, (p && p.nip) || "", r.date, "Shift " + r.shift, r.masuk || "", r.keluar || "", durasiMenit(r) || "", r.keluar ? "Selesai" : "Bertugas"]; }));
      downloadCsv("rekap-sipelok-" + todayStr() + ".csv", data);
    };
    el("#cetak").onclick = () => window.print();
    document.querySelectorAll("[data-foto]").forEach((b) => b.onclick = () => bukaLb(b.dataset.foto));

    if (isAdmin) {
      const perbaruiTombol = () => {
        const b = el("#hpilih");
        if (!b) return;
        b.disabled = terpilih.length === 0;
        b.innerHTML = "🗑 Hapus Terpilih" + (terpilih.length ? " (" + terpilih.length + ")" : "");
      };
      const ps = el("#psemua");
      if (ps) ps.onchange = () => {
        if (ps.checked) rows.forEach((r) => { if (terpilih.indexOf(r.id) < 0) terpilih.push(r.id); });
        else terpilih = terpilih.filter((id) => !rows.some((r) => r.id === id));
        document.querySelectorAll("[data-pilih]").forEach((c) => { c.checked = ps.checked; c.closest("tr").classList.toggle("sel", ps.checked); });
        perbaruiTombol();
      };
      document.querySelectorAll("[data-pilih]").forEach((c) => c.onchange = () => {
        const id = c.dataset.pilih;
        if (c.checked) { if (terpilih.indexOf(id) < 0) terpilih.push(id); }
        else terpilih = terpilih.filter((x) => x !== id);
        c.closest("tr").classList.toggle("sel", c.checked);
        if (ps) ps.checked = rows.length > 0 && rows.every((r) => terpilih.indexOf(r.id) >= 0);
        perbaruiTombol();
      });
      document.querySelectorAll("[data-hapusrec]").forEach((b) => b.onclick = () => {
        const r = S.records.find((x) => x.id === b.dataset.hapusrec);
        if (!r) return;
        if (confirm("Hapus presensi " + r.nama + " — " + fmtDateShort(r.date) + ", " + SHIFT[r.shift].label + "?")) {
          terpilih = terpilih.filter((x) => x !== r.id);
          deleteRecords([r.id]);
        }
      });
      const hp = el("#hpilih");
      if (hp) hp.onclick = () => {
        if (!terpilih.length) return;
        if (confirm("Hapus " + terpilih.length + " catatan presensi terpilih?\n\nUnduh CSV terlebih dahulu bila data masih diperlukan — tindakan ini tidak dapat dibatalkan.")) {
          deleteRecords(terpilih.slice());
          terpilih = [];
        }
      };
    }
  }
  function statCard(num, lbl, sub) {
    return '<div class="card stat rise"><div class="num tnum">' + num + '</div><div class="lbl">' + lbl + '</div><div class="sub">' + sub + '</div></div>';
  }
  function bukaLb(src) { el("#lbImg").src = src; el("#lb").classList.remove("hidden"); }
  function tutupLb() { el("#lb").classList.add("hidden"); }

  /* ============ JADWAL PER BULAN ============ */
  function renderJadwal() {
    const isAdmin = akun && akun.role === "admin";
    const namaBulan = new Date(kalTahun, kalBulan - 1, 1).toLocaleDateString("id-ID", { month: "long", year: "numeric" });

    // semua hari di bulan tsb
    const hariBulan = [];
    const d = new Date(kalTahun, kalBulan - 1, 1);
    while (d.getMonth() === kalBulan - 1) {
      hariBulan.push({ tanggal: todayStr(d), hari: d.getDay(), tanggalObj: new Date(d) });
      d.setDate(d.getDate() + 1);
    }

    // kalender: 5 kolom (Senin-Jumat), baris per minggu
    // Pastikan Senin selalu di kiri dengan padding hari kosong
    const minggu = [];
    let mingguIni = [];
    
    // Hitung padding awal (berapa hari kosong sebelum tanggal 1)
    const tanggal1 = new Date(kalTahun, kalBulan - 1, 1);
    const hariTanggal1 = tanggal1.getDay(); // 0=Minggu, 1=Senin, ...
    const paddingAwal = hariTanggal1 === 0 ? 4 : hariTanggal1 - 1; // Senin=0, Selasa=1, ...
    
    // Tambahkan padding kosong di awal
    for (let i = 0; i < paddingAwal; i++) {
      mingguIni.push(null); // null = hari kosong
    }
    
    // Tambahkan hari kerja
    hariBulan.forEach((h) => {
      if (h.hari === 0 || h.hari === 6) return; // skip Minggu & Sabtu
      mingguIni.push(h);
      if (mingguIni.length === 5) { 
        minggu.push(mingguIni); 
        mingguIni = []; 
      }
    });
    
    // Tambahkan sisa hari di minggu terakhir
    if (mingguIni.length) {
      // Padding akhir agar selalu 5 kolom
      while (mingguIni.length < 5) {
        mingguIni.push(null);
      }
      minggu.push(mingguIni);
    }

    const kalenderHtml = minggu.map((mg) =>
      '<div class="kalender">' +
      mg.map((h) => {
        // Jika null, tampilkan hari kosong
        if (!h) {
          return '<div class="tgl kosong"></div>';
        }
        const jd = jadwalUntukTanggal(h.tanggal);
        const s1 = jd.filter((j) => j.shift === 1).sort((a, b) => a.urutan - b.urutan);
        const s2 = jd.filter((j) => j.shift === 2).sort((a, b) => a.urutan - b.urutan);
        // Hanya tampilkan nama petugas (tanpa role)
        const namaShift = (list) => list.map((j) => {
          const p = S.petugas.find((x) => x.id === j.petugasId);
          return p ? esc(p.nama.split(",")[0]) : "—";
        }).join("<br>");

          console.log("=== ROTASI OTOMATIS START ===");
          
          // Filter prefix yang benar: YYYY-MM
          const prefix = kalTahun + "-" + pad(kalBulan);
          console.log("Bulan target:", prefix);
          console.log("Jumlah jadwal sebelum filter:", S.jadwal.length);
          
          // Validasi: cek duplikat ID di jadwal saat ini
          const idSet = new Set();
          const duplicateIds = [];
          S.jadwal.forEach(j => {
            if (idSet.has(j.id)) {
              duplicateIds.push(j.id);
            }
            idSet.add(j.id);
          });
          
          if (duplicateIds.length > 0) {
            console.warn("Found duplicate IDs in current jadwal:", duplicateIds.length);
            console.warn("Duplicate IDs:", duplicateIds.slice(0, 10));
            
            // Regenerate ID yang duplikat
            S.jadwal.forEach(j => {
              if (duplicateIds.includes(j.id)) {
                const oldId = j.id;
                j.id = uid();
                console.log("Regenerated ID:", oldId, "->", j.id);
              }
            });

          const jadwalLama = S.jadwal.filter((j) => j.tanggal.startsWith(prefix));
          console.log("Jumlah jadwal bulan ini yang akan dihapus:", jadwalLama.length);
          
          S.jadwal = S.jadwal.filter((j) => !j.tanggal.startsWith(prefix));

          console.log("Generating jadwal baru...");

          if (baru.length === 0) {
            alert("✗ Error: Tidak ada jadwal yang di-generate. Periksa console untuk detail.");
            return;
          }
          
          // Validasi: pastikan tidak ada ID duplikat di jadwal baru
          const baruIdSet = new Set();
          const baruDuplicateIds = [];
          baru.forEach(j => {
            if (baruIdSet.has(j.id)) {
              baruDuplicateIds.push(j.id);
            }
            baruIdSet.add(j.id);
          });
          
          if (baruDuplicateIds.length > 0) {
            console.error("ERROR: Duplicate IDs found in generated jadwal!", baruDuplicateIds);

            return;
          }
          
          // Verifikasi jadwal yang di-generate
          const tanggalUnik = [...new Set(baru.map(j => j.tanggal))];
          console.log("Tanggal unik yang di-generate:", tanggalUnik.length);
          console.log("Tanggal pertama:", tanggalUnik[0]);
          console.log("Tanggal terakhir:", tanggalUnik[tanggalUnik.length - 1]);
          
          S.jadwal = S.jadwal.concat(baru);
          console.log("Jumlah jadwal total setelah concat:", S.jadwal.length);
          
          // Validasi akhir: cek duplikat (tanggal, shift, urutan)
          const keySet = new Set();
          const duplicateKeys = [];
          S.jadwal.forEach(j => {
            const key = `${j.tanggal}-${j.shift}-${j.urutan}`;
            if (keySet.has(key)) {
              duplicateKeys.push(key);
            }
            keySet.add(key);
          });
          
          if (duplicateKeys.length > 0) {
            console.warn("Found duplicate keys in jadwal:", duplicateKeys.length);
            console.warn("Duplicate keys:", duplicateKeys.slice(0, 10));
          }
          
          // Simpan ke database
          console.log("Saving to database...");
          persist("jadwal", S.jadwal);
          emit();
          renderJadwal();
          
          console.log("=== ROTASI OTOMATIS END ===");
          
          alert("✓ Rotasi otomatis berhasil untuk " + namaBulan + "\n\n" +
                "Total slot: " + baru.length + "\n" +
                "Hari kerja: " + tanggalUnik.length + " hari\n" +
                "Periode: " + tanggalUnik[0] + " s/d " + tanggalUnik[tanggalUnik.length - 1] + "\n\n" +
                "Periksa console browser (F12) untuk detail logging.");
        }
      };
      el("#jimport").onclick = () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".csv";
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const lines = ev.target.result.split(/\r?\n/).filter((l) => l.trim());
              let count = 0;
              // hapus jadwal bulan ini dulu
              S.jadwal = S.jadwal.filter((j) => !j.tanggal.startsWith(kalTahun + "-" + pad(kalBulan)));
              lines.forEach((line, i) => {
                if (i === 0 && line.toLowerCase().indexOf("tanggal") >= 0) return; // skip header
                const parts = line.split(",").map((p) => p.trim().replace(/^"|"$/g, ""));
                // format: tanggal,shift,urutan,petugas_id
                if (parts[0] && parts[1] && parts[2] && parts[3]) {
                  S.jadwal.push({
                    id: uid(),
                    tanggal: parts[0],
                    shift: Number(parts[1]),
                    urutan: Number(parts[2]),
                    petugasId: parts[3]
                  });
                  count++;
                }
              });
              persist("jadwal", S.jadwal);
              emit();
              alert("✓ Berhasil import " + count + " jadwal untuk " + namaBulan + ".");
              renderJadwal();
            } catch (err) {
              alert("✗ Gagal import: " + err.message);
            }
          };
          reader.readAsText(file);
        };
        input.click();
      };
    }
    el("#jexport").onclick = () => {
      const jd = S.jadwal.filter((j) => j.tanggal.startsWith(kalTahun + "-" + pad(kalBulan)));
      const csv = ["tanggal,shift,urutan,petugas_id,nama_petugas"];
      jd.forEach((j) => {
        const p = S.petugas.find((x) => x.id === j.petugasId);
        csv.push([j.tanggal, j.shift, j.urutan, j.petugasId, p ? p.nama : ""].join(","));
      });
      const blob = new Blob([csv.join("\n")], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "jadwal-" + kalTahun + "-" + pad(kalBulan) + ".csv";
      a.click();
      URL.revokeObjectURL(url);
    };
    
    // Tombol bersihkan duplikat
    el("#jclean").onclick = async () => {
      if (!confirm("Ini akan menghapus semua jadwal duplikat dari database. Lanjutkan?")) {
        return;
      }
      
      console.log("=== BERSIHKAN DUPLIKAT START ===");
      
      try {
        // Panggil API untuk membersihkan duplikat
        const response = await fetch('api/cleanup_jadwal.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        
        const result = await response.json();
        
        if (result.ok) {
          console.log("Cleanup result:", result);
          alert(`✓ Berhasil membersihkan duplikat\n\n` +
                `Total baris: ${result.total}\n` +
                `Duplikat dihapus: ${result.deleted}\n` +
                `Sisa: ${result.remaining}`);
          
          // Reload data dari database
          await init();
          renderJadwal();
        } else {
          console.error("Cleanup failed:", result);
          alert("✗ Gagal membersihkan duplikat: " + (result.error || "Unknown error"));
        }
      } catch (err) {
        console.error("Cleanup error:", err);
        alert("✗ Error: " + err.message);
      }
      
      console.log("=== BERSIHKAN DUPLIKAT END ===");
    };
  }

        '<div class="row mt-2" style="flex-wrap:wrap;gap:8px"><input class="input grow" id="pnama" placeholder="Nama lengkap & gelar" style="min-width:220px">' +
        '<input class="input inline" id="pnip" placeholder="NIP (opsional)" style="width:200px">' +
        '<button class="btn primary" id="ptambah">+ Tambah</button>' +
        '<button class="btn light" id="pimport">⬇ Import CSV</button></div>' +
        '<input type="file" id="pfile" accept=".csv" class="hidden">' +
        '<p id="ppesan" class="small" style="color:var(--ruby-700);margin-top:8px;min-height:1em"></p>' +
        '<p class="small muted mt-1">Format CSV: <code>nama,nip</code> (satu petugas per baris)</p>' +
        '<div class="mt-2" style="display:flex;flex-direction:column;gap:8px">' +
        S.petugas.map((p) => {
          const n = S.jadwal.filter((j) => j.petugasId === p.id).length;
          return '<div class="row card" style="padding:12px 16px"><span class="ini lg">' + inisial(p.nama) + '</span>' +
            '<div class="grow"><b>' + esc(p.nama) + '</b><br><span class="small muted tnum">' + esc(p.nip || "NIP —") + ' · ' + n + ' slot jadwal</span></div>' +
            '<button class="btn danger sm" data-hapus="' + p.id + '">Hapus</button></div>';
        }).join("") + '</div>' +
      '</div>';
    el("#ptambah").onclick = () => {
      const nama = el("#pnama").value.trim();
      if (!nama) { el("#ppesan").textContent = "Nama wajib diisi."; return; }
      S.petugas.push({ id: uid(), nama: nama, nip: el("#pnip").value.trim() || null });
      persist("petugas", S.petugas); emit(); renderPetugas();
    };
    el("#pnama").onkeydown = (e) => { if (e.key === "Enter") el("#ptambah").click(); };
    el("#pimport").onclick = () => el("#pfile").click();
    el("#pfile").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const lines = ev.target.result.split(/\r?\n/).filter((l) => l.trim());
          let count = 0;
          lines.forEach((line, i) => {
            if (i === 0 && line.toLowerCase().indexOf("nama") >= 0) return; // skip header
            const parts = line.split(",").map((p) => p.trim().replace(/^"|"$/g, ""));
            if (parts[0]) {
              S.petugas.push({ id: uid(), nama: parts[0], nip: parts[1] || null });
              count++;
            }
          });
          persist("petugas", S.petugas);
          emit();
          el("#ppesan").innerHTML = '<span style="color:var(--lagoon-700)">✓ Berhasil import ' + count + ' petugas.</span>';
          setTimeout(renderPetugas, 500);
        } catch (err) {
          el("#ppesan").innerHTML = '<span style="color:var(--ruby-700)">✗ Gagal import: ' + esc(err.message) + '</span>';
        }
      };
      reader.readAsText(file);
    };
    document.querySelectorAll("[data-hapus]").forEach((b) => b.onclick = () => {
      const p = S.petugas.find((x) => x.id === b.dataset.hapus);
      if (p && confirm("Hapus " + p.nama + " beserta slot jadwalnya? Riwayat presensi tetap tersimpan.")) {
        S.petugas = S.petugas.filter((x) => x.id !== p.id);
        S.jadwal = S.jadwal.filter((j) => j.petugasId !== p.id);
        persistDelete("petugas", p.id, S.petugas); persist("jadwal", S.jadwal); emit(); renderPetugas();
      }
    });
  }

          '<br><span class="small muted tnum">@' + esc(a.username) + ' · ' + (a.role === "admin" ? "Admin penuh" : "Lihat saja") + '</span></div>' +
          (isAdmin ? '<button class="btn danger sm" data-hakun="' + esc(a.username) + '">Hapus</button>' : '') + '</div>').join("") + '</div>' +
        (isAdmin ? '<hr class="sep"><label class="f">Nama Pengguna</label><input class="input" id="au"><label class="f mt-1">Nama Tampilan</label><input class="input" id="an">' +
          '<label class="f mt-1">Kata Sandi</label><input class="input" id="ap" type="password"><label class="f mt-1">Peran</label>' +
          '<select class="input" id="ar"><option value="viewer">Lihat saja</option><option value="admin">Admin penuh</option></select>' +
          '<p id="apesan" class="small" style="color:var(--ruby-700);margin-top:8px;min-height:1em"></p>' +
          '<button class="btn primary mt-1" id="atambah">+ Tambah Akun</button>' : '<p class="small muted mt-2">Hanya admin yang dapat mengelola akun.</p>') +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:18px">' +
        '<div class="card pad rise"><span class="eyebrow">Ganti Kata Sandi Saya</span>' +
          '<input class="input mt-1" id="gc" type="password" placeholder="Kata sandi lama">' +
          '<input class="input mt-1" id="gn" type="password" placeholder="Kata sandi baru (min. 6)">' +
          '<input class="input mt-1" id="gk" type="password" placeholder="Ulangi kata sandi baru">' +
          '<p id="gpesan" class="small mt-1" style="min-height:1em"></p>' +
          '<button class="btn primary mt-1" id="gsimpan">Simpan Sandi Baru</button></div>' +
        '<div class="card pad rise"><span class="eyebrow">Data & Penyimpanan</span><div class="mt-1">' + modeBadgeHtml() + '</div>' +
          '<p class="small muted mt-1">' + (getMode() === "db" ? 'Data tersimpan terpusat di <b>MySQL</b> melalui api.php; semua perangkat melihat data yang sama.' : 'api.php tidak terdeteksi — data tersimpan lokal di perangkat ini saja (mode demo).') + '</p>' +
          (isAdmin ? '<div class="row mt-2" style="gap:8px;flex-wrap:wrap"><button class="btn light sm" id="dseed">Muat Data Contoh</button><button class="btn danger sm" id="dhapus">Hapus Semua Data</button></div>' : '') +
          '<p class="small muted mt-1" style="margin-bottom:0">Menghapus data tidak menghapus akun.</p></div>' +
      '</div></div>';

    if (isAdmin) {
      el("#atambah").onclick = () => {
        const r = addAccount(el("#au").value, el("#an").value, el("#ap").value, el("#ar").value);
        el("#apesan").textContent = r.ok ? "" : r.error;
        if (r.ok) { el("#au").value = el("#an").value = el("#ap").value = ""; renderAkun(); }
      };
      document.querySelectorAll("[data-hakun]").forEach((b) => b.onclick = () => {
        if (confirm("Hapus akun @" + b.dataset.hakun + "?")) { const r = removeAccount(b.dataset.hakun); if (!r.ok) alert(r.error); else renderAkun(); }
      });
      el("#dseed").onclick = () => { if (confirm("Muat ulang data contoh? Data petugas, jadwal & presensi saat ini diganti.")) { seedDemo(true); renderAkun(); } };
      el("#dhapus").onclick = () => {
        if (confirm("Hapus SEMUA petugas, jadwal, & presensi?")) {
          S.petugas = []; S.records = []; S.jadwal = [];
          ["petugas", "records", "jadwal"].forEach((t) => {
            lsWrite(LS[t], []);
            if (getMode() === "db") http("clear", { table: t }).catch(function () {});
          });
          emit(); renderAkun();
        }
      };
    }
    el("#gsimpan").onclick = () => {
      if (el("#gn").value !== el("#gk").value) { el("#gpesan").innerHTML = '<span style="color:var(--ruby-700)">Konfirmasi tidak sama.</span>'; return; }
      const r = changePassword(akun.username, el("#gc").value, el("#gn").value);
      el("#gpesan").innerHTML = r.ok ? '<span style="color:var(--lagoon-700)">Kata sandi berhasil diganti.</span>' : '<span style="color:var(--ruby-700)">' + esc(r.error) + '</span>';
      if (r.ok) { el("#gc").value = el("#gn").value = el("#gk").value = ""; }
    };
  }

  /* ============ mulai ============ */
  (async () => {
    try {
      await init();
      akun = getAuth();
      if (akun) renderShell(); else renderLogin();
      startSync();
      onChange(() => { if (akun) renderTab(); });
    } catch (err) {
      console.error("SIPELOK gagal dimulai:", err);
      el("#app").innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--ink-900)">' +
        '<div class="card pad" style="max-width:440px"><span class="eyebrow">Halaman tidak dapat dimulai</span>' +
        '<p class="mt-1">Terjadi galat: <b>' + esc(String((err && err.message) || err)) + '</b></p>' +
        '<button class="btn primary mt-2" onclick="location.reload()">Muat Ulang</button></div></div>';
    }
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin & Rekap · SIPELOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/gaya.css" />
<style>
  .grid-jadwal{display:grid;grid-template-columns:110px 1fr 1fr;gap:8px;align-items:center}
  .jhead{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);text-align:center}
  .modal-bg{position:fixed;inset:0;background:rgba(7,26,36,.75);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal-bg img{max-width:min(420px,92vw);max-height:74vh;border-radius:16px;border:4px solid #fff}
  .filter-chip{padding:8px 16px;border-radius:999px;border:none;font-weight:800;font-size:.78rem;cursor:pointer;background:var(--mist-100);color:var(--ink-600);transition:background .2s}
  .filter-chip.on{background:var(--ink-900);color:#fff}
</style>
</head>
<body class="bg-paper">
<div id="app"></div>

<script src="js/util.js"></script>
<script>
  let akun = null, tabAktif = "rekap", q = "", cepat = "today", fShift = 0, fDari = "", fSampai = "";
  let lightboxSrc = null;

  /* ============ gerbang masuk ============ */
  function renderLogin() {
    el("#app").innerHTML =
      '<div class="bg-board" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">' +
      '<div class="card pad rise" style="width:100%;max-width:400px">' +
        '<div class="row"><span class="mk" style="width:44px;height:44px;border-radius:12px;background:var(--brand-500);color:#16100a;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3 5 5.8v5.4c0 4.5 3 7.8 7 9.3 4-1.5 7-4.8 7-9.3V5.8L12 3Z"/><path d="m9 11.5 2.2 2.2L15.5 9"/></svg></span>' +
        '<div><b class="display" style="font-size:1.2rem">Konsol Admin</b><br><span class="small muted">SIPELOK · BPS Kab. Konawe</span></div></div>' +
        '<div class="mt-2"><label class="f">Nama Pengguna</label><input class="input" id="lu" value="admin" autocomplete="username"></div>' +
        '<div class="mt-1"><label class="f">Kata Sandi</label><input class="input" id="lp" type="password" placeholder="••••••••" autocomplete="current-password"></div>' +
        '<p id="lerr" class="small" style="color:var(--ruby-700);margin-top:10px"></p>' +
        '<button class="btn primary block mt-2" id="lbtn">Masuk</button>' +
        '<p class="small muted center mt-2">Akun bawaan: <b>admin</b> / <b>bpskonawe</b></p>' +
        '<p class="small center mt-1"><a href="index.html">← Kembali ke beranda</a></p>' +
      '</div></div>';
    const go = () => {
      const a = login(el("#lu").value, el("#lp").value);
      if (!a) { el("#lerr").textContent = "Nama pengguna atau kata sandi salah."; return; }
      akun = a; renderShell();
    };
    el("#lbtn").onclick = go;
    el("#lp").onkeydown = (e) => { if (e.key === "Enter") go(); };
  }

  /* ============ kerangka ============ */
  function renderShell() {
    const tabs = [
      ["rekap", "📊 Rekap Presensi"], ["jadwal", "🗓 Jadwal Piket"],
      ["petugas", "👤 Petugas"], ["akun", "🔐 Akun & Data"],
    ];
    el("#app").innerHTML =
      '<header class="topbar"><div class="wrap">' +
        '<a class="brandmark" href="index.html"><span class="mk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M7 16.5v-3M11 16.5v-5M15 16.5v-2"/></svg></span>' +
        '<span><b>SIPELOK</b><small>Konsol Admin</small></span></a>' +
        '<div class="grow"></div><span id="modeBadge" class="hide-sm"></span>' +
        '<span class="badge brand">' + esc(akun.nama) + '</span>' +
        '<button class="btn ghost sm" id="keluar">Keluar</button>' +
      '</div></header>' +
      '<nav class="tabs" id="tabbar">' + tabs.map(([id, lbl]) =>
        '<button data-tab="' + id + '" class="' + (id === tabAktif ? "on" : "") + '">' + lbl + '</button>').join("") + '</nav>' +
      '<main class="wrap" style="padding-top:26px;padding-bottom:60px"><div id="isi"></div></main>' +
      '<div id="lb" class="modal-bg hidden" onclick="tutupLb()"><img id="lbImg" alt="foto atribut"></div>';

    el("#modeBadge").innerHTML = modeBadgeHtml();
    el("#keluar").onclick = () => { logout(); akun = null; renderLogin(); };
    document.querySelectorAll("#tabbar button").forEach((b) =>
      b.onclick = () => { tabAktif = b.dataset.tab; renderShell(); });
    renderTab();
  }

  function renderTab() {
    if (tabAktif === "rekap") renderRekap();
    else if (tabAktif === "jadwal") renderJadwal();
    else if (tabAktif === "petugas") renderPetugas();
    else renderAkun();
  }

  /* ============ PIKET HARI INI ============ */
  function piketHariIniHtml() {
    const t = todayStr(), jd = jadwalUntuk(new Date());
    const baris = [1, 2].map((sh) => {
      const list = jd.filter((j) => j.shift === sh);
      if (!list.length) return "";
      const isi = list.map((j) => {
        const p = S.petugas.find((x) => x.id === j.petugasId);
        const rec = S.records.find((r) => r.date === t && r.shift === sh && r.petugasId === j.petugasId);
        let st = '<span class="badge ruby">Belum presensi</span>';
        if (rec && rec.keluar) st = '<span class="badge mist">Selesai ' + fmtHM(rec.masuk) + '–' + fmtHM(rec.keluar) + '</span>';
        else if (rec) st = '<span class="badge lagoon">Bertugas sejak ' + fmtHM(rec.masuk) + '</span>';
        return '<div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><b>' + esc(p ? p.nama : "—") + '</b>' + st + '</div>';
      }).join("");
      return '<div class="card pad" style="padding:14px 18px"><span class="badge ' + (sh === 1 ? "brand" : "lagoon") + '">' + SHIFT[sh].label + ' · ' + SHIFT[sh].nama + '</span><div class="mt-1" style="display:flex;flex-direction:column;gap:8px">' + isi + '</div></div>';
    }).join("");
    return '<div class="card pad rise"><div class="row" style="justify-content:space-between"><span class="eyebrow">Piket Hari Ini — ' + fmtDateLong(t) + '</span>' +
      '<button class="btn light sm" onclick="tabAktif=\'jadwal\';renderShell()">Atur Jadwal →</button></div>' +
      '<div class="grid-2 mt-1">' + (baris || '<span class="small muted">Belum ada jadwal hari ini.</span>') + '</div></div>';
  }

  /* ============ REKAP ============ */
  function barisRekap() {
    let rows = S.records.slice();
    const t = todayStr();
    if (cepat === "today") rows = rows.filter((r) => r.date === t);
    else if (cepat === "7d") { const d = new Date(); d.setDate(d.getDate() - 6); const s = todayStr(d); rows = rows.filter((r) => r.date >= s); }
    else if (cepat === "month") { const m = t.slice(0, 7); rows = rows.filter((r) => r.date.startsWith(m)); }
    else { if (fDari) rows = rows.filter((r) => r.date >= fDari); if (fSampai) rows = rows.filter((r) => r.date <= fSampai); }
    if (fShift) rows = rows.filter((r) => r.shift === fShift);
    if (q) rows = rows.filter((r) => r.nama.toLowerCase().includes(q.toLowerCase()));
    return rows.sort((a, b) => (b.date + b.masuk).localeCompare(a.date + a.masuk));
  }

  function renderRekap() {
    const rows = barisRekap();
    const stat = {
      total: rows.length,
      selesai: rows.filter((r) => r.keluar).length,
      bertugas: rows.filter((r) => !r.keluar).length,
      telat: rows.filter((r) => menitTerlambat(r) > 0).length,
    };
    const chips = [["today", "Hari Ini"], ["7d", "7 Hari"], ["month", "Bulan Ini"], ["all", "Semua"]];

    el("#isi").innerHTML =
      piketHariIniHtml() +
      '<div class="stats mt-2">' +
        statCard(stat.total, "Total Presensi", "pada rentang terpilih") +
        statCard(stat.selesai, "Selesai", "masuk & pulang tercatat") +
        statCard(stat.bertugas, "Sedang Bertugas", "belum presensi pulang") +
        statCard(stat.telat, "Terlambat", "> 10 mnt dari jadwal") +
      '</div>' +
      '<div class="card pad mt-2 rise no-print">' +
        '<div class="row" style="flex-wrap:wrap;gap:8px">' +
          chips.map(([k, l]) => '<button class="filter-chip ' + (cepat === k ? "on" : "") + '" data-q="' + k + '">' + l + '</button>').join("") +
          '<input class="input inline grow" style="min-width:180px" id="cq" placeholder="Cari nama petugas…" value="' + esc(q) + '">' +
        '</div>' +
        '<div class="row mt-1" style="flex-wrap:wrap;gap:8px">' +
          '<input type="date" class="input inline" id="cdari" value="' + fDari + '">' +
          '<span class="muted">–</span><input type="date" class="input inline" id="csampai" value="' + fSampai + '">' +
          '<select class="input inline" id="cshift"><option value="0">Semua shift</option><option value="1" ' + (fShift === 1 ? "selected" : "") + '>Shift 1 · Pagi</option><option value="2" ' + (fShift === 2 ? "selected" : "") + '>Shift 2 · Siang</option></select>' +
          '<div class="grow"></div>' +
          '<button class="btn light sm" id="cetak">🖨 Cetak</button>' +
          '<button class="btn primary sm" id="csv">⬇ Ekspor CSV</button>' +
        '</div>' +
      '</div>' +
      '<div class="table-wrap mt-2 rise">' +
        (rows.length === 0 ? '<div class="pad center small muted">Tidak ada data pada rentang ini.</div>' :
        '<table><thead><tr><th>Petugas</th><th>Tanggal</th><th>Shift</th><th>Masuk</th><th>Pulang</th><th>Durasi</th><th>Foto</th><th>Status</th></tr></thead><tbody>' +
        rows.map((r) => {
          const p = S.petugas.find((x) => x.id === r.petugasId);
          const telat = menitTerlambat(r);
          const status = r.keluar ? '<span class="badge mist">Selesai</span>' : '<span class="badge lagoon">Bertugas</span>';
          const foto = (r.fotoMasuk || r.fotoKeluar) ? '<button class="btn light sm" data-foto="' + (r.fotoMasuk || r.fotoKeluar) + '">Lihat</button>' : '<span class="muted small">—</span>';
          return '<tr class="' + (r.date === todayStr() ? "today" : "") + '">' +
            '<td><div class="row"><span class="ini">' + inisial(r.nama) + '</span><div><b>' + esc(r.nama) + '</b><br><span class="small muted tnum">' + esc(p && p.nip ? p.nip : "NIP —") + '</span></div></div></td>' +
            '<td class="tnum">' + fmtDateShort(r.date) + '</td>' +
            '<td><span class="badge ' + (r.shift === 1 ? "brand" : "lagoon") + '">' + SHIFT[r.shift].label + '</span></td>' +
            '<td class="tnum"><b style="color:var(--lagoon-700)">' + fmtHM(r.masuk) + '</b>' + (telat > 0 ? '<br><span class="small" style="color:var(--ruby-700)">+' + telat + ' mnt</span>' : '') + '</td>' +
            '<td class="tnum">' + (r.keluar ? fmtHM(r.keluar) : "—") + '</td>' +
            '<td class="tnum">' + fmtDurasi(durasiMenit(r)) + '</td>' +
            '<td>' + foto + '</td><td>' + status + '</td></tr>';
        }).join("") + '</tbody></table>') +
        '<div class="pad small muted" style="padding:12px 18px">Menampilkan ' + rows.length + ' dari ' + S.records.length + ' catatan.</div>' +
      '</div>';

    document.querySelectorAll(".filter-chip").forEach((c) => c.onclick = () => { cepat = c.dataset.q; renderRekap(); });
    el("#cq").oninput = (e) => { q = e.target.value; renderRekap(); };
    el("#cq").focus(); const v = el("#cq"); v.setSelectionRange(v.value.length, v.value.length);
    el("#cdari").onchange = (e) => { fDari = e.target.value; cepat = "all"; renderRekap(); };
    el("#csampai").onchange = (e) => { fSampai = e.target.value; cepat = "all"; renderRekap(); };
    el("#cshift").onchange = (e) => { fShift = Number(e.target.value); renderRekap(); };
    el("#csv").onclick = () => {
      const data = [["Nama", "NIP", "Tanggal", "Shift", "Masuk", "Pulang", "Durasi (mnt)", "Status"]].concat(
        rows.map((r) => { const p = S.petugas.find((x) => x.id === r.petugasId); return [r.nama, p && p.nip || "", r.date, "Shift " + r.shift, r.masuk || "", r.keluar || "", durasiMenit(r) || "", r.keluar ? "Selesai" : "Bertugas"]; }));
      downloadCsv("rekap-sipelok-" + todayStr() + ".csv", data);
    };
    el("#cetak").onclick = () => window.print();
    document.querySelectorAll("[data-foto]").forEach((b) => b.onclick = () => bukaLb(b.dataset.foto));
  }
  function statCard(num, lbl, sub) {
    return '<div class="card stat rise"><div class="num tnum">' + num + '</div><div class="lbl">' + lbl + '</div><div class="sub">' + sub + '</div></div>';
  }
  function bukaLb(src) { el("#lbImg").src = src; el("#lb").classList.remove("hidden"); }
  function tutupLb() { el("#lb").classList.add("hidden"); }

  /* ============ JADWAL ============ */
  function renderJadwal() {
    const hariIni = new Date().getDay();
    const sel = (hari, shift) => {
      const cur = S.jadwal.find((j) => j.hari === hari && j.shift === shift);
      return '<select class="input" data-hari="' + hari + '" data-shift="' + shift + '" style="padding:8px 10px;font-size:.82rem">' +
        '<option value="">— kosong —</option>' +
        S.petugas.map((p) => '<option value="' + p.id + '" ' + (cur && cur.petugasId === p.id ? "selected" : "") + '>' + esc(p.nama) + '</option>').join("") +
        '</select>';
    };
    const grid = HARI_KERJA.map((h) =>
      '<div class="jhead" style="text-align:left' + (h === hariIni ? ";color:var(--brand-600)" : "") + '">' + HARI[h] + (h === hariIni ? " ·" : "") + '</div>' +
      sel(h, 1) + sel(h, 2)).join("");

    const beban = {};
    S.jadwal.forEach((j) => { beban[j.petugasId] = (beban[j.petugasId] || 0) + 1; });
    const bebanHtml = S.petugas.map((p) =>
      '<span class="badge mist tnum" style="text-transform:none;letter-spacing:0">' + esc(p.nama) + ' · ' + (beban[p.id] || 0) + ' slot</span>').join(" ");

    el("#isi").innerHTML =
      '<div class="card pad rise">' +
        '<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">' +
          '<div><span class="eyebrow">Jadwal Piket Mingguan</span><h2 class="display mt-1">Senin – Sabtu · 2 Shift</h2></div>' +
          '<div class="row"><button class="btn light sm" id="jcsv">⬇ Unduh CSV</button>' +
          '<button class="btn primary sm" id="jrotasi">↻ Rotasi Otomatis</button>' +
          '<button class="btn danger sm" id="jkosong">Kosongkan</button></div>' +
        '</div>' +
        '<p class="small muted mt-1">Titik (·) menandakan hari ini. Minggu libur. Perubahan tersimpan otomatis.</p>' +
        '<div class="mt-2"><div class="grid-jadwal"><span></span><span class="jhead">Shift 1 · Pagi (08–12)</span><span class="jhead">Shift 2 · Siang (12–16)</span>' + grid + '</div></div>' +
        '<hr class="sep"><span class="eyebrow">Distribusi Giliran</span><div class="row mt-1" style="flex-wrap:wrap;gap:6px">' + (bebanHtml || '<span class="small muted">Belum ada petugas.</span>') + '</div>' +
      '</div>';

    document.querySelectorAll("[data-hari]").forEach((s) => s.onchange = () => {
      const hari = Number(s.dataset.hari), shift = Number(s.dataset.shift), pid = s.value;
      S.jadwal = S.jadwal.filter((j) => !(j.hari === hari && j.shift === shift));
      if (pid) S.jadwal.push({ id: uid(), hari, shift, petugasId: pid });
      persist("jadwal", S.jadwal); emit(); renderJadwal();
    });
    el("#jrotasi").onclick = () => { if (confirm("Susun rotasi otomatis dari daftar petugas? Jadwal lama diganti.")) { S.jadwal = generateJadwal(); persist("jadwal", S.jadwal); emit(); renderJadwal(); } };
    el("#jkosong").onclick = () => { if (confirm("Kosongkan seluruh jadwal piket?")) { S.jadwal = []; persist("jadwal", S.jadwal); emit(); renderJadwal(); } };
    el("#jcsv").onclick = () => {
      const data = [["Hari", "Shift", "Petugas", "NIP"]];
      HARI_KERJA.forEach((h) => [1, 2].forEach((sh) => {
        const j = S.jadwal.find((x) => x.hari === h && x.shift === sh);
        const p = j ? S.petugas.find((x) => x.id === j.petugasId) : null;
        data.push([HARI[h], "Shift " + sh + " (" + SHIFT[sh].nama + ")", p ? p.nama : "", p && p.nip || ""]);
      }));
      downloadCsv("jadwal-piket-sipelok.csv", data);
    };
  }

  /* ============ PETUGAS ============ */
  function renderPetugas() {
    el("#isi").innerHTML =
      '<div class="card pad rise">' +
        '<span class="eyebrow">Kelola Petugas Piket</span><h2 class="display mt-1">Daftar Petugas (' + S.petugas.length + ')</h2>' +
        '<div class="row mt-2" style="flex-wrap:wrap;gap:8px"><input class="input grow" id="pnama" placeholder="Nama lengkap & gelar" style="min-width:220px">' +
        '<input class="input inline" id="pnip" placeholder="NIP (opsional)" style="width:200px">' +
        '<button class="btn primary" id="ptambah">+ Tambah</button></div>' +
        '<p id="ppesan" class="small" style="color:var(--ruby-700);margin-top:8px"></p>' +
        '<div class="mt-2" style="display:flex;flex-direction:column;gap:8px">' +
        S.petugas.map((p) => {
          const n = S.jadwal.filter((j) => j.petugasId === p.id).length;
          return '<div class="row card" style="padding:12px 16px"><span class="ini lg">' + inisial(p.nama) + '</span>' +
            '<div class="grow"><b>' + esc(p.nama) + '</b><br><span class="small muted tnum">' + esc(p.nip || "NIP —") + ' · ' + n + ' slot jadwal</span></div>' +
            '<button class="btn danger sm" data-hapus="' + p.id + '">Hapus</button></div>';
        }).join("") + '</div>' +
      '</div>';
    el("#ptambah").onclick = () => {
      const nama = el("#pnama").value.trim();
      if (!nama) { el("#ppesan").textContent = "Nama wajib diisi."; return; }
      S.petugas.push({ id: uid(), nama, nip: el("#pnip").value.trim() || null });
      persist("petugas", S.petugas); emit(); renderPetugas();
    };
    document.querySelectorAll("[data-hapus]").forEach((b) => b.onclick = () => {
      const p = S.petugas.find((x) => x.id === b.dataset.hapus);
      if (confirm("Hapus " + p.nama + " beserta slot jadwalnya? Riwayat presensi tetap tersimpan.")) {
        S.petugas = S.petugas.filter((x) => x.id !== p.id);
        S.jadwal = S.jadwal.filter((j) => j.petugasId !== p.id);
        persistDelete("petugas", p.id, S.petugas); persist("jadwal", S.jadwal); emit(); renderPetugas();
      }
    });
  }

  /* ============ AKUN & DATA ============ */
  function renderAkun() {
    const isAdmin = akun.role === "admin";
    el("#isi").innerHTML =
      '<div class="grid-2">' +
      '<div class="card pad rise">' +
        '<span class="eyebrow">Akun Akses</span><h2 class="display mt-1">Kelola Akun</h2>' +
        '<div class="mt-1" style="display:flex;flex-direction:column;gap:8px">' +
        S.accounts.map((a) => '<div class="row card" style="padding:12px 16px"><span class="ini">' + inisial(a.nama) + '</span>' +
          '<div class="grow"><b>' + esc(a.nama) + '</b> ' + (a.username === akun.username ? '<span class="small accent">(Anda)</span>' : '') +
          '<br><span class="small muted tnum">@' + esc(a.username) + ' · ' + a.role + '</span></div>' +
          (isAdmin ? '<button class="btn danger sm" data-hakun="' + esc(a.username) + '">Hapus</button>' : '') + '</div>').join("") + '</div>' +
        (isAdmin ? '<hr class="sep"><label class="f">Nama Pengguna</label><input class="input" id="au"><label class="f mt-1">Nama Tampilan</label><input class="input" id="an">' +
          '<label class="f mt-1">Kata Sandi</label><input class="input" id="ap" type="password"><label class="f mt-1">Peran</label>' +
          '<select class="input" id="ar"><option value="viewer">Lihat saja</option><option value="admin">Admin penuh</option></select>' +
          '<p id="apesan" class="small" style="color:var(--ruby-700);margin-top:8px"></p>' +
          '<button class="btn primary mt-1" id="atambah">+ Tambah Akun</button>' : '<p class="small muted mt-2">Hanya admin yang dapat mengelola akun.</p>') +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:18px">' +
        '<div class="card pad rise"><span class="eyebrow">Ganti Kata Sandi Saya</span>' +
          '<input class="input mt-1" id="gc" type="password" placeholder="Kata sandi lama">' +
          '<input class="input mt-1" id="gn" type="password" placeholder="Kata sandi baru (min. 6)">' +
          '<input class="input mt-1" id="gk" type="password" placeholder="Ulangi kata sandi baru">' +
          '<p id="gpesan" class="small mt-1"></p>' +
          '<button class="btn primary mt-1" id="gsimpan">Simpan Sandi Baru</button></div>' +
        '<div class="card pad rise"><span class="eyebrow">Data & Penyimpanan</span>' + modeBadgeHtml() +
          '<p class="small muted mt-1">' + (getMode() === "db" ? 'Data tersimpan terpusat di <b>MySQL</b> via api.php; semua perangkat melihat data sama.' : 'api.php tidak terdeteksi — data tersimpan lokal di perangkat ini saja.') + '</p>' +
          (isAdmin ? '<div class="row mt-2"><button class="btn light sm" id="dseed">Muat Data Contoh</button><button class="btn danger sm" id="dhapus">Hapus Semua Data</button></div>' : '') +
          '<p class="small muted mt-1">Menghapus data tidak menghapus akun.</p></div>' +
      '</div></div>';

    if (isAdmin) {
      el("#atambah").onclick = () => {
        const r = addAccount(el("#au").value, el("#an").value, el("#ap").value, el("#ar").value);
        el("#apesan").textContent = r.ok ? "" : r.error;
        if (r.ok) { el("#au").value = el("#an").value = el("#ap").value = ""; renderAkun(); }
      };
      document.querySelectorAll("[data-hakun]").forEach((b) => b.onclick = () => {
        if (confirm("Hapus akun @" + b.dataset.hakun + "?")) { const r = removeAccount(b.dataset.hakun); if (!r.ok) alert(r.error); else renderAkun(); }
      });
      el("#dseed").onclick = () => { if (confirm("Muat ulang data contoh? Data saat ini diganti.")) { seedDemo(true); renderAkun(); } };
      el("#dhapus").onclick = () => {
        if (confirm("Hapus SEMUA petugas, jadwal, sesi & presensi?")) {
          S.petugas = []; S.records = []; S.jadwal = []; S.sessions = [];
          ["petugas", "records", "jadwal", "sessions"].forEach((t) => { persistDelete(t, "", []); if (getMode() === "db") http("clear", { table: t }); });
          emit(); renderAkun();
        }
      };
    }
    el("#gsimpan").onclick = () => {
      if (el("#gn").value !== el("#gk").value) { el("#gpesan").innerHTML = '<span style="color:var(--ruby-700)">Konfirmasi tidak sama.</span>'; return; }
      const r = changePassword(akun.username, el("#gc").value, el("#gn").value);
      el("#gpesan").innerHTML = r.ok ? '<span style="color:var(--lagoon-700)">Kata sandi berhasil diganti.</span>' : '<span style="color:var(--ruby-700)">' + r.error + '</span>';
      if (r.ok) { el("#gc").value = el("#gn").value = el("#gk").value = ""; }
    };
  }

  /* ============ mulai ============ */
  (async () => {
    await init();
    akun = getAuth();
    if (akun) renderShell(); else renderLogin();
    startSync();
    onChange(() => { if (akun) renderTab(); });
  })();
</script>
</body>
</html>
